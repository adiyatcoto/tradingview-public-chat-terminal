<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Public Chat Viewer</title>
<style>
  :root {
    --bg: #0c0e0f;
    --panel: #121517;
    --panel-2: #171b1d;
    --line: #23292c;
    --text: #d8dedd;
    --text-dim: #7c8a89;
    --accent: #3ddc97;
    --accent-dim: #1f6b4f;
    --amber: #e0a845;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    display: flex;
    overflow: hidden;
  }

  /* Sidebar */
  #sidebar {
    width: var(--sidebar-width, 260px);
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    transition: width 0.2s ease, border-color 0.2s ease;
  }
  body.sidebar-collapsed #sidebar {
    width: 0;
    border-right-color: transparent;
  }
  #sidebar-resizer {
    position: fixed;
    z-index: 50;
    top: 0;
    bottom: 0;
    left: calc(var(--sidebar-width, 260px) - 3px);
    width: 7px;
    cursor: col-resize;
  }
  #sidebar-resizer::after {
    content: ""; position: absolute; inset: 0 2px; background: transparent; transition: background .15s;
  }
  #sidebar-resizer:hover::after, body.resizing-sidebar #sidebar-resizer::after { background: var(--accent); }
  body.sidebar-collapsed #sidebar-resizer { display: none; }
  #sidebar-header {
    padding: 18px 16px 12px;
    border-bottom: 1px solid var(--line);
  }
  #sidebar-header .dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 8px;
    box-shadow: 0 0 6px var(--accent);
  }
  #sidebar-header h1 {
    font-size: 13px;
    letter-spacing: 0.3px;
    font-weight: 600;
    flex: 0 1 280px;
    margin: 0;
    color: var(--text);
  }
  #sidebar-header p {
    margin: 4px 0 0 15px;
    font-size: 11px;
    color: var(--text-dim);
  }
  #notification-summary {
    margin: 9px 0 0 15px; padding: 6px 9px; border: 1px solid var(--line);
    border-radius: 999px; font: 600 11px inherit; color: var(--text-dim);
    background: var(--panel-2); cursor: pointer; display: inline-flex;
    align-items: center; justify-content: center; gap: 6px; line-height: 17px;
  }
  #notification-summary:hover { color: var(--accent); border-color: var(--accent-dim); background: #1b2822; }
  #notification-summary .section-badge { display: block; margin: 0; }
  #notification-modal { display: none; position: fixed; z-index: 110; inset: 0; background: rgb(0 0 0 / 65%); align-items: center; justify-content: center; }
  #notification-modal.active { display: flex; }
  #notification-panel { width: min(560px, calc(100vw - 32px)); max-height: min(640px, calc(100vh - 32px)); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  #notification-panel h3 { margin: 0 0 10px; font-size: 14px; }
  .notification-item { width: 100%; text-align: left; display: block; padding: 10px; margin: 0 0 5px; background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; font: 12px inherit; }
  .notification-item:hover { border-color: var(--accent-dim); }
  .notification-item .notification-meta { display: block; margin-top: 6px; font-size: 12px; font-weight: 600; }
  .notification-item .notification-room { color: #77bfff; }
  .notification-item .notification-time { color: #c89cff; }
  .notification-item.unread { border-left: 3px solid #ed4b4b; background: #321d22; }
  .notification-item .notification-label { color: var(--text-dim); font-size: 11px; }
  .notification-item .notification-message { display: block; margin-top: 3px; white-space: pre-wrap; }
  #room-list {
    list-style: none;
    margin: 0;
    padding: 8px;
    overflow-y: auto;
    flex: 1;
  }
  #room-list li {
    padding: 9px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 2px;
    display: flex;
    justify-content: flex-start;
    align-items: center;
    gap: 8px;
  }
  #room-list li:hover { background: var(--panel-2); color: var(--text); }
  #room-list li.active {
    background: var(--accent-dim);
    color: #eafff4;
    box-shadow: inset 3px 0 0 var(--accent);
    font-weight: 700;
  }
  #room-list li.active .room-title { color: #eafff4; }
  #room-list li .room-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 0 1 auto; }
  #room-list li .room-id {
    font-size: 10px;
    color: var(--text-dim);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    flex-shrink: 0;
  }
  .room-badge, .section-badge {
    min-width: 17px; height: 17px; padding: 0 5px; border-radius: 9px;
    background: #df4d4d; color: white; font: 700 10px/17px inherit; text-align: center; flex-shrink: 0;
  }
  .room-star { appearance: none; border: 0; padding: 0 2px; background: transparent; color: #65706f; font: 17px/1 inherit; cursor: pointer; flex: 0 0 auto; }
  .room-star:hover, .room-star.active { color: #f2c14e; }
  #room-list li.room-section-header { padding: 10px 4px 4px; margin: 0; }
  /* Rooms are children of Public/Private categories: retain stable indentation
     without separating the dot and badge from the room name. */
  #room-list li.room-entry { margin-left: 12px; width: calc(100% - 12px); padding-left: 12px; }
  .room-section-toggle {
    width: 100%; display: flex; justify-content: space-between; align-items: center;
    padding: 3px 6px; color: var(--text-dim); background: none; border: 0;
    cursor: pointer; text-transform: uppercase; letter-spacing: .08em; font: 700 10px inherit;
  }
  .room-section-toggle:hover { color: var(--accent); }
  /* Parent categories intentionally use a colour distinct from room names. */
  .room-section-header.public-section .room-section-toggle { color: #62b6ff; }
  .room-section-header.private-section .room-section-toggle { color: #c992ff; }
  .room-section-header.favorites-section .room-section-toggle { color: #f2c14e; }
  .room-section-header.public-section .room-section-toggle:hover { color: #9bd4ff; }
  .room-section-header.private-section .room-section-toggle:hover { color: #e0bdff; }
  .room-section-header.favorites-section .room-section-toggle:hover { color: #ffdc7d; }
  .room-section-header .room-section-toggle > span:first-child { font-weight: 800; }
  #room-list li.room-entry.section-hidden { display: none; }

  /* Main */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
    position: relative;
  }
  body.mine-filter #messages { background: #351521; }
  body.mine-filter #compose-wrap { background: #281019; }
  #notification-banner { display: none; width: 100%; border: 0; background: #c93636; color: white; padding: 10px 18px; font: 800 13px inherit; letter-spacing: .02em; cursor: pointer; text-align: center; }
  #notification-banner.active { display: block; }
  #notification-banner:hover { background: #e04747; }
  #message-toast-stack { position: fixed; z-index: 120; top: 14px; left: 50%; width: min(360px, calc(100vw - 36px)); transform: translateX(-50%); display: grid; gap: 8px; }
  .message-toast {
    --toast-accent: #3ddc97; --toast-bg: #17302a;
    position: relative; display: flex; align-items: flex-start; gap: 10px; padding: 11px 37px 11px 13px; border: 1px solid var(--toast-accent);
    border-radius: 15px; background: var(--toast-bg); color: var(--text); box-shadow: 0 12px 32px rgb(0 0 0 / 42%);
    cursor: pointer; text-align: left; animation: toast-in .2s ease;
  }
  @keyframes toast-in { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: none; } }
  .message-toast:hover { filter: brightness(1.12); }
  .message-toast .toast-avatar { position: relative; width: 30px; height: 30px; overflow: hidden; border-radius: 50%; display: grid; place-items: center; flex: 0 0 auto; background: var(--toast-accent); color: #07110e; font: 800 13px inherit; }
  .message-toast .toast-avatar img { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: inherit; object-fit: cover; }
  .message-toast .toast-copy { min-width: 0; width: 0; flex: 1 1 auto; }
  .message-toast .toast-meta { display: block; color: var(--toast-accent); font-size: 11px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .message-toast .toast-message { display: block; margin-top: 3px; color: var(--text); font-size: 12px; line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .message-toast .toast-close { position: absolute; right: 7px; top: 6px; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 50%; background: transparent; color: var(--text-dim); font: 28px/1 inherit; cursor: pointer; display: grid; place-items: center; }
  .message-toast .toast-close:hover { color: white; }
  #main-header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 10px;
  }
  .header-primary, .header-controls { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .header-controls { flex-wrap: wrap; }
  #sidebar-toggle {
    width: 30px;
    height: 30px;
    flex-shrink: 0;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--panel-2);
    color: var(--text-dim);
    cursor: pointer;
    font-size: 17px;
    line-height: 1;
  }
  #sidebar-toggle:hover {
    color: var(--accent);
    border-color: var(--accent-dim);
  }
  #main-header h2 {
    font-size: 15px;
    margin: 0;
    font-weight: 600;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 0 1 auto;
  }
  #main-header .status {
    font-size: 11px;
    color: var(--text-dim);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  #main-header .status.error { color: #e0574a; }
  #chat-filter { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: 12px inherit; }
  #clear-history { background: none; color: var(--text-dim); border: 0; cursor: pointer; font: 11px inherit; }
  #clear-history:hover { color: #e0574a; }
  #cache-size { color: var(--text-dim); font: 10.5px ui-monospace, "SF Mono", Menlo, monospace; white-space: nowrap; }
  @media (max-width: 760px) {
    #main-header { padding: 10px 12px; gap: 7px; }
    .header-primary { flex-wrap: wrap; gap: 7px; }
    #main-header .status { flex: 1 1 100%; }
    #message-search { width: 100%; }
    #jump-latest { right: 12px; }
  }
  #load-older { align-self: center; background: var(--panel-2); color: var(--text-dim); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  #load-older:hover { color: var(--accent); border-color: var(--accent-dim); }
  .unread-divider { display: flex; align-items: center; gap: 8px; margin: 10px 0 6px; color: #ed4b4b; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
  .unread-divider::before, .unread-divider::after { content: ""; height: 1px; flex: 1; background: #ed4b4b; opacity: .75; }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg {
    display: flex;
    gap: 10px;
  }
  @keyframes fadein { from { opacity: 0; transform: translateY(3px);} to { opacity: 1; transform: none; } }
  .msg img.avatar {
    width: 30px; height: 30px;
    border-radius: 6px;
    flex-shrink: 0;
    background: var(--panel-2);
    object-fit: cover;
  }
  .msg .body { min-width: 0; flex: 1; }
  .msg .meta {
    font-size: 12px;
    margin-bottom: 2px;
    display: flex;
    gap: 8px;
    align-items: baseline;
  }
  .msg .username { font-weight: 600; }
  .msg .username a { color: var(--amber); text-decoration: none; }
  .msg .username a:hover { color: #ffd27d; text-decoration: underline; }
  .msg .mention-user-btn {
    border: 0; background: none; color: var(--accent); font: 800 13px/1 inherit;
    padding: 0 2px; cursor: pointer; border-radius: 3px;
  }
  .msg .mention-user-btn:hover { background: var(--accent-dim); color: #eafff4; }
  .inline-mention {
    display: inline; border: 0; padding: 0; margin: 0; background: none;
    color: #62b6ff; font: inherit; font-weight: 700; cursor: pointer;
  }
  .inline-mention:hover { color: #9bd4ff; text-decoration: underline; }
  .msg .time {
    color: var(--text-dim);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 10.5px;
  }
  .msg .symbol {
    color: var(--accent);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 10.5px;
  }
  .msg .text {
    font-size: 13.5px;
    line-height: 1.5;
    overflow-wrap: anywhere;
    word-break: break-word;
    white-space: pre-wrap;
    max-width: 100%;
  }
  .quoted-message {
    margin: 5px 0 7px; padding: 6px 9px; border-left: 2px solid var(--accent-dim);
    background: var(--panel-2); border-radius: 4px; color: var(--text-dim); font-size: 12.5px;
    overflow-wrap: anywhere; word-break: break-word; max-width: 100%;
  }
  .quoted-message .quote-author { color: var(--accent); font-size: 11px; margin-bottom: 2px; }
  .msg .snapshot {
    margin-top: 6px;
    max-width: 320px;
    border-radius: 6px;
    border: 1px solid var(--line);
    display: block;
    cursor: zoom-in;
    background: var(--panel-2);
  }
  .msg .snapshot:hover { border-color: var(--accent); }
  .snapshot-link { display: inline-block; margin-top: 6px; }
  .chat-link { color: #62b6ff; text-decoration: underline; text-decoration-color: color-mix(in srgb, #62b6ff 45%, transparent); overflow-wrap: anywhere; }
  .chat-link:hover { color: #9bd4ff; }
  .tv-link-preview {
    width: min(440px, 100%); margin-top: 7px; border: 1px solid var(--line);
    border-radius: 7px; overflow: hidden; background: var(--panel-2);
  }
  .tv-link-preview > a { display: block; color: inherit; text-decoration: none; }
  .tv-link-preview img { display: block; width: 100%; max-height: 230px; object-fit: cover; cursor: zoom-in; background: var(--bg); }
  .tv-link-preview .preview-copy { padding: 8px 10px; }
  .tv-link-preview strong { display: block; font-size: 12px; color: var(--text); }
  .tv-link-preview small { display: block; color: var(--text-dim); font-size: 11px; margin-top: 3px; line-height: 1.35; }
  .tv-link-preview.loading { min-height: 30px; padding: 8px 10px; color: var(--text-dim); font-size: 11px; }
  .tv-link-preview .preview-thumbnail { position: relative; height: 150px; display: grid; place-items: center; overflow: hidden; color: #dcecff; background: linear-gradient(145deg, #142b42, #0d1724 55%, #183649); font: 800 22px/1.1 inherit; letter-spacing: -.03em; }
  .tv-link-preview .preview-thumbnail::before { content: ""; position: absolute; width: 150%; height: 1px; background: repeating-linear-gradient(90deg, transparent 0 18px, rgb(155 212 255 / 18%) 18px 19px); transform: rotate(-12deg); }
  .tv-link-preview .preview-thumbnail span { position: relative; padding: 8px 12px; border: 1px solid rgb(155 212 255 / 35%); border-radius: 7px; background: rgb(7 19 31 / 65%); }

  #image-modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgb(0 0 0 / 85%);
    padding: 28px;
    align-items: center;
    justify-content: center;
    cursor: zoom-out;
  }
  #image-modal.active { display: flex; }
  #image-modal img { max-width: 100%; max-height: 100%; object-fit: contain; cursor: default; }
  #image-modal-close {
    position: absolute; top: 14px; right: 18px; border: 0; background: none;
    color: white; font-size: 30px; cursor: pointer;
  }

  .msg .actions {
    margin-top: 4px;
  }
  .msg .reply-btn {
    font-size: 11px;
    color: var(--text-dim);
    background: none;
    border: none;
    cursor: pointer;
    padding: 2px 0;
    font-family: inherit;
  }
  .msg .reply-btn:hover { color: var(--accent); }

  /* Compose area */
  #compose-wrap {
    border-top: 1px solid var(--line);
    padding: 12px 24px 16px;
    position: relative;
  }
  #jump-latest {
    position: absolute; right: 24px; bottom: calc(100% + 10px); z-index: 15;
    border: 1px solid var(--accent-dim); border-radius: 18px; padding: 7px 11px;
    background: var(--panel-2); color: var(--accent); box-shadow: 0 5px 16px rgb(0 0 0 / 35%);
    font: 700 12px inherit; cursor: pointer;
  }
  #jump-latest:hover { background: var(--accent-dim); color: #eafff4; }
  #quote-preview {
    display: none;
    font-size: 11.5px;
    color: var(--text-dim);
    background: var(--panel-2);
    border-left: 2px solid var(--accent-dim);
    padding: 8px 34px 8px 10px;
    border-radius: 4px;
    position: absolute;
    left: 24px;
    right: 24px;
    bottom: calc(100% + 8px);
    z-index: 12;
    box-shadow: 0 -5px 18px rgb(0 0 0 / 24%);
  }
  #quote-preview.active { display: block; }
  #quote-author { display: block; color: var(--accent); font-size: 11px; font-weight: 700; margin-bottom: 4px; }
  #quote-preview button {
    background: none; border: none; color: var(--text-dim);
    cursor: pointer; font-size: 14px; line-height: 1;
  }
  #quote-edit-input {
    display: block; width: 100%; min-height: 34px; max-height: 220px; resize: none; border: 0;
    background: transparent; color: var(--text-dim); font: inherit; line-height: 1.4;
  }
  /* The quote box is anchored above the composer; textarea growth expands
     upward rather than pushing the input downward. */
  #quote-clear { position: absolute; top: 7px; right: 9px; width: 30px; height: 30px; font-size: 24px !important; }
  #quote-edit-input:focus { outline: none; color: var(--text); }
  #ticker-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  #ticker-row label { color: var(--text-dim); font-size: 10.5px; white-space: nowrap; }
  #compose-row { display: flex; gap: 6px; align-items: flex-end; }
  #compose-input {
    flex: 1;
    min-width: 0;
    min-height: 30px;
    resize: none;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 8px;
    padding: 5px 8px;
    font-size: 12px;
    font-family: inherit;
    line-height: 1.5;
    max-height: 260px;
  }
  .resize-handle {
    position: absolute; z-index: 2; width: 62px; height: 15px; padding: 0; border: 0;
    border-radius: 5px 5px 0 0; background: var(--panel-2); color: var(--text-dim);
    font: 700 8px/15px inherit; letter-spacing: .02em; cursor: ns-resize; user-select: none;
  }
  .resize-handle:hover, .resize-handle:focus-visible { color: var(--accent); outline: none; }
  /* The resize handle spans the chat-feed divider and the composer area. */
  #compose-resize { top: -8px; left: 24px; }
  #compose-input:focus { outline: none; border-color: var(--accent-dim); }
  #message-search {
    width: min(260px, 24vw);
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 7px; padding: 8px 10px; font: inherit; font-size: 12px;
  }
  #message-search:focus { outline: none; border-color: var(--accent-dim); }
  #send-btn {
    background: var(--accent-dim);
    color: #eafff4;
    border: none;
    border-radius: 8px;
    height: 30px;
    padding: 0 10px;
    font-size: 11px;
    cursor: pointer;
    flex-shrink: 0;
  }
  #send-btn:hover { background: var(--accent); color: #06130d; }
  #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  #capture-btn {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    height: 30px; border-radius: 8px; padding: 0 9px; font-size: 10px; cursor: pointer; flex-shrink: 0;
  }
  #capture-btn:hover { border-color: var(--accent); color: var(--accent); }
  #emoji-btn { height: 30px; background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 0 8px; font-size: 14px; cursor: pointer; }
  #emoji-btn:hover { border-color: var(--accent); }
  #emoji-picker {
    position: absolute; bottom: 76px; right: 116px; display: none; z-index: 20;
    max-width: 310px; padding: 7px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--panel-2); box-shadow: 0 10px 28px rgb(0 0 0 / 45%);
  }
  #emoji-picker.active { display: flex; flex-wrap: wrap; gap: 2px; }
  #emoji-picker .picker-head { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 0 3px 3px; color: var(--text-dim); font-size: 11px; }
  #emoji-picker .picker-close, .modal-close { width: 30px; height: 30px; border: 0; border-radius: 50%; background: none; color: var(--text-dim); font: 24px/1 inherit; cursor: pointer; padding: 0; display: grid; place-items: center; }
  #emoji-picker .picker-close:hover, .modal-close:hover { color: white; }
  #emoji-picker button { border: 0; background: transparent; padding: 5px; font-size: 18px; cursor: pointer; border-radius: 4px; }
  #emoji-picker button:hover { background: var(--accent-dim); }
  #symbol-input {
    width: min(220px, 100%); background: var(--panel-2); border: 1px solid var(--line);
    height: 30px; color: var(--text); border-radius: 6px; padding: 0 8px; font: 11px ui-monospace, "SF Mono", Menlo, monospace;
  }
  #symbol-input:focus { outline: none; border-color: var(--accent-dim); }

<script>
const POLL_MS = 5000;

let roomsById = new Map();

let notificationIds = new Set(JSON.parse(localStorage.getItem("tv-chat-notification-ids") || "[]"));

let roomLatestIds = JSON.parse(localStorage.getItem("tv-chat-room-latest") || "{}");
let roomWatchPrimed = Boolean(localStorage.getItem("tv-chat-room-watch-primed"));
const collapsedSections = new Set(JSON.parse(localStorage.getItem("tv-chat-collapsed-sections") || "[]"));
const favoriteRoomIds = new Set(JSON.parse(localStorage.getItem("tv-chat-favorite-rooms") || "[]"));
const visitedRoomIds = new Set(JSON.parse(localStorage.getItem("tv-chat-visited-rooms") || "[]"));
const roomActivity = JSON.parse(localStorage.getItem("tv-chat-room-activity") || "{}");
let notificationBannerVisible = false;

const roomListEl = document.getElementById("room-list");
const messagesEl = document.getElementById("messages");
const roomTitleEl = document.getElementById("room-title");
const statusEl = document.getElementById("status");
const sidebarToggle = document.getElementById("sidebar-toggle");
const sidebarResizer = document.getElementById("sidebar-resizer");
const chatFilter = document.getElementById("chat-filter");
const messageSearch = document.getElementById("message-search");
const notificationBadge = document.getElementById("notification-badge");
const notificationSummary = document.getElementById("notification-summary");
const notificationModal = document.getElementById("notification-modal");
const notificationList = document.getElementById("notification-list");
const notificationBanner = document.getElementById("notification-banner");
const notificationModalClose = document.getElementById("notification-modal-close");
const messageToastStack = document.getElementById("message-toast-stack");
const cacheSizeEl = document.getElementById("cache-size");
const jumpLatestBtn = document.getElementById("jump-latest");
let notificationUnread = Number(localStorage.getItem("tv-chat-notification-unread") || 0);
const NOTIFICATION_STORE_VERSION = "2";
function saveNotificationRecords() {
  notificationRecords = notificationRecords.slice(-300);
  notificationUnread = notificationRecords.reduce((count, item) => count + Number(!item.read), 0);
  localStorage.setItem("tv-chat-notification-records", JSON.stringify(notificationRecords));

  notificationBanner.textContent = `${notificationUnread > 99 ? "99+" : notificationUnread} New Notifications!`;

}

  const unlock = new Audio("/sounds/mention.mp3");
  unlock.volume = 0;

  notificationModal.classList.add("active");
}
function notificationData(item) {
  // Struktur onsite_notifications berbeda antar tipe notifikasi. Cari field
  // semantik secara rekursif, alih-alih mengasumsikan text.content.data saja.
  const seen = new Set();
  const find = (names) => {
    const visit = (value) => {
      if (!value || typeof value !== "object" || seen.has(value)) return undefined;
      seen.add(value);
      for (const name of names) if (typeof value[name] === "string" || typeof value[name] === "number") return value[name];
      for (const child of Object.values(value)) {
        const result = visit(child);
        if (result !== undefined) return result;
      }
      return undefined;
    };
    const result = visit(item);
    seen.clear();
    return result;
  };
  const link = String(find(["url", "href", "link"]) || "");
  const roomFromLink = link.match(/[?&]room_id=([^&#/]+)/i)?.[1];
  return {
    ...item,
    room_id: String(find(["room_id", "roomId", "chat_room_id", "conversation_room_id", "chat_id", "room"]) || roomFromLink || ""),
    username: String(find(["username", "user_name", "author_username", "sender_username", "from_username"]) || ""),
    text: String(find(["message", "chat_message", "message_text", "body", "text"]) || ""),
    time: find(["time", "created_at", "timestamp", "date"]) || item.time,
  };
}
// Earlier versions combined TradingView onsite payloads (often just names and
// times) with chat messages. Discard that ambiguous data once; thereafter only
// messages observed in the local chat feed are retained.
if (localStorage.getItem("tv-chat-notification-store-version") !== NOTIFICATION_STORE_VERSION) {
  notificationRecords = [];
} else {
  notificationRecords = notificationRecords.filter((item) => item.source === "chat" && item.room_id && item.username && item.message_text);
}
saveNotificationRecords();
function renderNotificationList() {
  notificationList.innerHTML = "";
  const records = notificationRecords;
  if (!records.length) { notificationList.textContent = "No replyable chat mentions or replies yet."; return; }
  records.slice().reverse().forEach((item) => {
    const button = document.createElement("button");
    button.className = `notification-item${item.read ? "" : " unread"}`;
    button.type = "button";
    const quoted = item.quoted_text ? `<span class="notification-label">Your message</span><span class="notification-message">${escapeHtml(item.quoted_text)}</span>` : "";
    const label = item.quoted_text ? "Reply from" : "Mention from";
    button.innerHTML = `${quoted}<span class="notification-label">${label}</span><strong> ${escapeHtml(item.username)}</strong>` +
      `<span class="notification-message">${escapeHtml(item.reply_text || item.message_text)}</span>` +
      `<span class="notification-meta"><span class="notification-room">${escapeHtml(item.room_title || item.room_id)}</span> · <span class="notification-time">${fmtTime(item.time)}</span></span>`;
    // Notifications use escaped HTML text. Replace emoji shortcodes afterward
    // to preserve safety while matching the main chat presentation.
    button.querySelectorAll(".notification-message").forEach((node) => {
      const message = node.textContent;
      node.textContent = "";
      appendEmojiShortcodes(node, message);
    });
    button.addEventListener("click", () => navigateToNotification(item));
    notificationList.appendChild(button);

}
notificationSummary.addEventListener("click", () => {
  openNotificationModal();
});
notificationBanner.addEventListener("click", () => { notificationBannerVisible = false; renderNotificationBadge(); openNotificationModal(); });
notificationModalClose.addEventListener("click", () => notificationModal.classList.remove("active"));
notificationModal.addEventListener("click", (event) => { if (event.target === notificationModal) notificationModal.classList.remove("active"); });
renderNotificationBadge();
chatFilter.value = localStorage.getItem("tv-chat-filter") || "all";
function applyChatFilterAppearance() { document.body.classList.toggle("mine-filter", chatFilter.value === "mine"); }
applyChatFilterAppearance();
chatFilter.addEventListener("change", () => { localStorage.setItem("tv-chat-filter", chatFilter.value); applyChatFilterAppearance(); renderCurrentMessages(); });
messageSearch.value = localStorage.getItem("tv-chat-message-search") || "";
messageSearch.addEventListener("input", () => {
  localStorage.setItem("tv-chat-message-search", messageSearch.value);
  renderCurrentMessages();
});

function mentionsOrRepliesMe(message) {
  if (!selfUsername) return false;
  const text = String(message.text || "").toLowerCase();
  const username = selfUsername.trim().replace(/^@/, "").toLowerCase();
  // TradingView has sent quotes both with and without quotation marks.
  return text.includes(`@${username}`) ||
    text.includes(`[quote="${username}"]`) ||
    text.includes(`[quote=${username}]`);
}
function recordChatNotification(room, message, { countUnread = false } = {}) {
  if (!room || !message?.id || !message.username || !mentionsOrRepliesMe(message)) return;
  const id = `chat:${room.room_id}:${message.id}`;
  const quote = extractLeadingQuote(message.text || "");
  const replyText = replyTextFromMessage(message.text || "") || String(message.text || "").trim();
  const record = {
    id,
    source: "chat",
    room_id: room.room_id,
    room_title: room.title || room.room_id,
    username: message.username,
    message_text: String(message.text || ""),
    quoted_text: quote?.content?.trim() || "",
    reply_text: replyText,
    time: message.time,
    message_id: message.id,
    type: "chat_mention_or_reply",
    read: !countUnread,
  };
  const index = notificationRecords.findIndex((item) => String(item.id) === id);
  if (index >= 0) record.read = Boolean(notificationRecords[index].read), notificationRecords[index] = record;
  else {
    notificationRecords.push(record);
    if (countUnread) {
      notificationBannerVisible = true;
    }
  }
  saveNotificationRecords();
}
function rememberRoomActivity(roomId, time = Date.now()) {
  roomActivity[roomId] = new Date(time).getTime() || Date.now();
  localStorage.setItem("tv-chat-room-activity", JSON.stringify(roomActivity));
}
function processIncomingMessage(room, message, { countUnread = false } = {}) {
  const sender = String(message?.username || "").replace(/^@/, "").toLowerCase();
  const isMine = sender && sender === String(selfUsername || "").replace(/^@/, "").toLowerCase();
  const special = mentionsOrRepliesMe(message);
  if (special) recordChatNotification(room, message, { countUnread });
  if (countUnread && !isMine) {
    new Audio(special ? "/sounds/mention.mp3" : "/sounds/feed.mp3").play().catch(() => {});
  }
  if (room?.room_id) rememberRoomActivity(room.room_id, message.time);
  if (countUnread && !isMine) showIncomingToast(room, message);
}
function showIncomingToast(room, message) {
  if (!room || !message) return;
  const sender = String(message.username || "Someone").replace(/^@/, "");
  const preview = replyTextFromMessage(message.text || "") || String(message.text || "").replace(/\[[^\]]+\]/g, "").trim() || "Sent a new message";
  const palettes = [
    ["#3ddc97", "#17302a"], ["#62b6ff", "#172936"], ["#c992ff", "#2d2039"],
    ["#f2c14e", "#352d18"], ["#ff8d72", "#38231f"], ["#67d9d0", "#173331"],
  ];
  const roomKey = String(room.room_id || "");
  const index = [...roomKey].reduce((sum, char) => sum + char.charCodeAt(0), 0) % palettes.length;
  const toast = document.createElement("div");
  toast.className = "message-toast";
  toast.tabIndex = 0;
  toast.setAttribute("role", "button");
  toast.setAttribute("aria-label", `Open message from ${sender} in ${room.title || room.room_id}`);
  toast.style.setProperty("--toast-accent", palettes[index][0]);
  toast.style.setProperty("--toast-bg", palettes[index][1]);
  const avatar = document.createElement("span");
  avatar.className = "toast-avatar";
  avatar.textContent = sender.slice(0, 1).toUpperCase() || "?";
  if (message.user_pic) {
    const photo = document.createElement("img");
    photo.src = message.user_pic;
    photo.alt = "";
    // If the avatar CDN fails, the initials fallback behind the image remains
    // visible, consistent with avatars in the message list.
    photo.onerror = () => photo.remove();
    avatar.appendChild(photo);
  }
  const copy = document.createElement("span");
  copy.className = "toast-copy";
  const meta = document.createElement("span");
  meta.className = "toast-meta";
  meta.textContent = `${sender} · ${room.title || room.room_id}`;
  const body = document.createElement("span");
  body.className = "toast-message";
  appendEmojiShortcodes(body, preview);
  copy.append(meta, body);
  const close = document.createElement("button");
  close.type = "button";
  close.className = "toast-close";
  close.setAttribute("aria-label", "Dismiss notification");
  close.textContent = "×";
  close.addEventListener("click", (event) => { event.stopPropagation(); toast.remove(); });
  const openRoom = () => {
    toast.remove();
    if (room.room_id === currentRoom) jumpToLatest();
    else selectRoom(room);
  };
  toast.addEventListener("click", openRoom);
  toast.addEventListener("keydown", (event) => { if (event.key === "Enter" || event.key === " ") { event.preventDefault(); openRoom(); } });

  // notification bubbles.

}
function shouldShow(message) {
  const matchesFilter = chatFilter.value === "all" || String(message.username || "").toLowerCase() === selfUsername.toLowerCase() || mentionsOrRepliesMe(message);
  const query = messageSearch.value.trim().toLowerCase();
  const matchesSearch = !query || String(message.username || "").toLowerCase().includes(query) || String(message.text || "").toLowerCase().includes(query);
  return matchesFilter && matchesSearch;
}
function saveUnread() {
  localStorage.setItem("tv-chat-unread", JSON.stringify(unreadByRoom));
  localStorage.setItem("tv-chat-unread-start", JSON.stringify(unreadStartByRoom));
}
function updateJumpLatestButton() {
  const unread = currentRoom ? Number(unreadByRoom[currentRoom] || 0) : 0;
  const atBottom = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 12;
  jumpLatestBtn.hidden = !currentRoom || atBottom;
  jumpLatestBtn.textContent = unread ? (unread > 99 ? "↓ 99+ new messages" : `↓ ${unread} new messages`) : "↓ Latest";
  jumpLatestBtn.setAttribute("aria-label", unread ? `Jump to ${unread} new messages` : "Jump to latest message");
}
function markCurrentRoomRead() {
  if (!currentRoom || !unreadByRoom[currentRoom]) return;

  delete unreadStartByRoom[currentRoom];
  saveUnread();
  messagesEl.querySelectorAll(".unread-divider").forEach((divider) => divider.remove());
  updateJumpLatestButton();

}
function jumpToLatest() {
  const selectedRoom = currentRoom;

  // immediately, then repeat after the next layout frame to reach the latest
  // message even when media or preview heights have not yet settled.

}
jumpLatestBtn.addEventListener("click", jumpToLatest);
// Version 2 discards old cache data that could contain a delayed room response
// received while the user was switching rooms.
function historyKey(roomId) { return `tv-chat-history:v2:${roomId}`; }
function formatBytes(bytes) {
  if (!bytes) return "0 B";
  const units = ["B", "KB", "MB", "GB"];
  const index = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
  return `${(bytes / (1024 ** index)).toFixed(index ? 1 : 0)} ${units[index]}`;
}
function updateCacheSize() {
  let bytes = 0;
  Object.keys(localStorage).filter((key) => key.startsWith("tv-chat-history:")).forEach((key) => {
    // UTF-8 byte length, not merely the JavaScript character count.
    bytes += new Blob([localStorage.getItem(key) || ""]).size;
  });
  cacheSizeEl.textContent = `cache ${formatBytes(bytes)}`;
}
function saveHistory() {
  if (!currentRoom) return;
  // Limit each room to 1,000 messages to prevent unbounded local storage use.
  localStorage.setItem(historyKey(currentRoom), JSON.stringify(currentMessages.slice(-1000)));
  updateCacheSize();
}
function loadHistory(roomId) {
  try { const saved = JSON.parse(localStorage.getItem(historyKey(roomId)) || "[]"); return Array.isArray(saved) ? saved : []; }
  catch (_) { return []; }
}
document.getElementById("clear-history").addEventListener("click", () => {
  Object.keys(localStorage).filter((key) => key.startsWith("tv-chat-history:")).forEach((key) => localStorage.removeItem(key));
  updateCacheSize();
  if (currentRoom) { currentMessages = []; currentOffset = 0; hasMoreHistory = true; fetchMessages({ reset: true }); }
});
updateCacheSize();

function setSidebarCollapsed(collapsed) {
  document.body.classList.toggle("sidebar-collapsed", collapsed);
  sidebarToggle.textContent = collapsed ? "›" : "‹";
  sidebarToggle.title = collapsed ? "Show room panel" : "Hide room panel";
  sidebarToggle.setAttribute("aria-label", sidebarToggle.title);
  sidebarToggle.setAttribute("aria-expanded", String(!collapsed));
}

const savedSidebarWidth = Number(localStorage.getItem("tv-chat-sidebar-width"));
if (savedSidebarWidth >= 180 && savedSidebarWidth <= 560) {
  document.documentElement.style.setProperty("--sidebar-width", `${savedSidebarWidth}px`);
}
let resizeStartX = 0;
let resizeStartWidth = 0;
sidebarResizer.addEventListener("pointerdown", (event) => {
  if (document.body.classList.contains("sidebar-collapsed")) return;
  resizeStartX = event.clientX;
  resizeStartWidth = document.getElementById("sidebar").getBoundingClientRect().width;
  document.body.classList.add("resizing-sidebar");
  sidebarResizer.setPointerCapture(event.pointerId);
  event.preventDefault();
});
sidebarResizer.addEventListener("pointermove", (event) => {
  if (!document.body.classList.contains("resizing-sidebar")) return;
  const width = Math.max(180, Math.min(560, resizeStartWidth + event.clientX - resizeStartX));

sidebarResizer.addEventListener("pointerup", () => {

function fmtTime(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return "";
  return d.toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" });
}

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

// Shortcodes supplied by the TradingView UI. Messages remain shortcodes upstream
// so they appear native to other users; only the local view replaces them with
// visual emoji.
const TV_EMOJIS = {
  ":)": "🙂", ":agree:": "👍", ":disagree:": "👎", ":okay:": "👌", ":peace:": "✌️", ":wait:": "✋", ":wave:": "👋", ":raised_hands:": "🙌", ":pray:": "🙏",
  ":D": "😄", ":joy:": "😂", ";)": "😉", ":love:": "😍", ":P": "😛", ":flushed:": "😳", ":|": "😐", ":thinking_face:": "🤔", ":(": "☹️", ":weary:": "😩", ":'(": "😢", ":cry:": "😭", ":panic:": "😱", ":rage:": "😡", ":triumph:": "😤", ":mask:": "😷", ":shades:": "😎", ":sleepy:": "😪", "o_O": "🫤", ":halo:": "😇", ":sarcasm:": "🙄", "]:-)": "😈", ":money_mouth:": "🤑", ":zzz:": "💤",
  ":buy:": "🟢", ":sell:": "🔴", ":profit:": "📈", ":loss:": "📉", ":uptrend:": "📈", ":downtrend:": "📉", ":bear:": "🐻", ":bull:": "🐂", ":dollar:": "💵", ":euro:": "💶", ":pound:": "💷", ":yen:": "💴", ":bitcoin:": "₿", ":ethereum:": "♦️", ":moneybag:": "💰",
  ":cookie:": "🍪", ":coffee:": "☕", ":popcorn:": "🍿", ":cocktail:": "🍸", ":hot:": "🌶️", ":poop:": "💩", ":heart:": "❤️", ":heartbroken:": "💔", ":sun:": "☀️", ":moon:": "🌙", ":sunflower:": "🌻", ":star:": "⭐", ":sunny:": "🌞", ":partly_sunny:": "🌤️", ":cloud:": "☁️", ":zap:": "⚡", ":hammer:": "🔨", ":idea:": "💡", ":slot_machine:": "🎰", ":bullseye:": "🎯", ":rocket:": "🚀", ":inverted_rocket:": "🚀", ":checkered_flag:": "🏁", ":alarm_clock:": "⏰", ":rip:": "🪦", ":ghost:": "👻", ":up:": "🆙", ":cool:": "🆒", ":free:": "🆓", ":sos:": "🆘", ":100:": "💯", ":stop:": "🛑"
};
const TV_EMOJI_PATTERN = new RegExp(Object.keys(TV_EMOJIS).sort((a, b) => b.length - a.length).map((key) => key.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|"), "g");

function appendEmojiShortcodes(parent, value) {
  const text = String(value || "");
  let cursor = 0;
  TV_EMOJI_PATTERN.lastIndex = 0;
  let match;
  while ((match = TV_EMOJI_PATTERN.exec(text))) {
    if (match.index > cursor) parent.append(document.createTextNode(text.slice(cursor, match.index)));
    const emoji = document.createElement("span");
    emoji.textContent = TV_EMOJIS[match[0]];
    emoji.title = match[0];
    emoji.setAttribute("aria-label", match[0]);
    parent.appendChild(emoji);
    cursor = match.index + match[0].length;
  }
  if (cursor < text.length || !text) parent.append(document.createTextNode(text.slice(cursor)));
}

function addTextWithEmojis(parent, value) {
  const text = String(value || "");
  // A @username in message content can be selected directly for a new mention
  // without creating a quote. The leading boundary prevents email addresses
  // from becoming mentions.
  const appendEmojiText = (part) => appendEmojiShortcodes(parent, part);
  const mentionPattern = /(^|[^A-Za-z0-9_])@([A-Za-z0-9_]{1,100})/g;
  let cursor = 0;
  let match;
  while ((match = mentionPattern.exec(text))) {
    const beforeMention = text.slice(cursor, match.index) + match[1];
    if (beforeMention) appendEmojiText(beforeMention);
    const username = match[2];
    const mention = document.createElement("button");
    mention.type = "button";
    mention.className = "inline-mention";
    mention.textContent = `@${username}`;
    mention.title = `Mention @${username}`;
    mention.addEventListener("click", () => mentionUser(username));
    parent.appendChild(mention);
    cursor = match.index + match[0].length;
  }
  if (cursor < text.length || !text) appendEmojiText(text.slice(cursor));
}

// All links are clickable. Preview metadata is created only for TradingView
// pages; URLs from other domains are never previewed automatically.
const URL_RE = /https?:\/\/[^\s<>"']+/gi;
function snapshotUrl(url) {
  try {
    const parsed = new URL(url);
    if (parsed.protocol !== "https:" || !(parsed.hostname === "tradingview.com" || parsed.hostname.endsWith(".tradingview.com"))) return "";
    // TradingView shares snapshots as either .../id or .../id.png.
    const match = parsed.pathname.match(/^\/snapshots\/([^/]+)\/([A-Za-z0-9_-]+?)(?:_thumb)?(?:\.png)?\/?$/i);
    if (!match) return "";
    return `https://s3.tradingview.com/snapshots/${match[1]}/${match[2]}.png`;
  } catch (_) { return ""; }
}

function fullSnapshotUrl(url) {
  return snapshotUrl(url) || url.replace(/_thumb(?=\.png(?:\?|$))/i, "");
}

function openImage(url) {
  imageModalImg.src = fullSnapshotUrl(url);
  imageModal.classList.add("active");
}

function addSnapshot(parent, url) {
  const img = document.createElement("img");
  img.className = "snapshot";
  img.src = fullSnapshotUrl(url);
  img.alt = "Chart snapshot — click to enlarge";
  img.loading = "lazy";
  img.addEventListener("click", () => openImage(url));
  parent.appendChild(img);
}

function cleanChatUrl(url) {
  // Sentence punctuation following a URL is not part of the hyperlink.
  return url.replace(/[.,;:!]+$/, "").replace(/\)+$/, "");
}

function isTradingViewLink(url) {
  try {
    const parsed = new URL(url);
    return parsed.protocol === "https:" && (parsed.hostname === "tradingview.com" || parsed.hostname.endsWith(".tradingview.com"));
  } catch (_) { return false; }
}

function tradingViewShortSnapshot(url) {
  try {
    const parsed = new URL(url);
    if (!(parsed.hostname === "tradingview.com" || parsed.hostname.endsWith(".tradingview.com"))) return "";
    const id = parsed.pathname.match(/^\/x\/([A-Za-z0-9_-]{6,64})\/?$/i)?.[1];
    // The /x/<id>/ short link is a native TradingView snapshot. Its image URL
    // can render directly, avoiding reliance on page metadata or the backend
    // preview endpoint.
    return id ? `https://s3.tradingview.com/snapshots/${id[0].toLowerCase()}/${id}.png` : "";
  } catch (_) { return ""; }
}

function addExternalLink(parent, url) {
  const link = document.createElement("a");
  link.className = "chat-link";
  link.href = url;
  link.target = "_blank";
  link.rel = "noopener noreferrer";
  link.textContent = url;
  parent.appendChild(link);
}

const previewRequests = new Map();
function getTradingViewPreview(url) {
  if (!previewRequests.has(url)) {
    previewRequests.set(url, fetch(`/api/link-preview?url=${encodeURIComponent(url)}`)
      .then((res) => res.ok ? res.json() : Promise.reject(new Error("preview unavailable"))));
  }
  return previewRequests.get(url);
}

function addTradingViewPreview(parent, url) {
  const card = document.createElement("div");
  card.className = "tv-link-preview loading";
  card.textContent = "Loading TradingView preview…";
  parent.appendChild(card);
  getTradingViewPreview(url).then((preview) => {
    card.classList.remove("loading");
    card.textContent = "";
    const pageLink = document.createElement("a");
    pageLink.href = preview.url || url;
    pageLink.target = "_blank";
    pageLink.rel = "noopener noreferrer";
    if (preview.image) {
      const image = document.createElement("img");
      image.src = preview.image;
      image.alt = preview.title || "Preview TradingView";
      image.loading = "lazy";
      image.addEventListener("click", (event) => { event.preventDefault(); openImage(preview.image); });
      pageLink.appendChild(image);
    } else {
      const thumbnail = document.createElement("div");
      thumbnail.className = "preview-thumbnail";
      thumbnail.innerHTML = "<span>TradingView</span>";
      pageLink.appendChild(thumbnail);
    }
    const copy = document.createElement("div");
    copy.className = "preview-copy";
    const title = document.createElement("strong");
    title.textContent = preview.title || "TradingView";
    copy.appendChild(title);
    if (preview.description) {
      const description = document.createElement("small");
      description.textContent = preview.description;
      copy.appendChild(description);
    }
    pageLink.appendChild(copy);
    card.appendChild(pageLink);
  }).catch(() => {
    card.classList.remove("loading");
    card.textContent = "";
    const pageLink = document.createElement("a");
    pageLink.href = url;
    pageLink.target = "_blank";
    pageLink.rel = "noopener noreferrer";
    pageLink.innerHTML = '<div class="preview-thumbnail"><span>TradingView</span></div><div class="preview-copy"><strong>TradingView</strong></div>';
    card.appendChild(pageLink);
  });
}

function addRichText(parent, value) {
  const text = String(value || "");
  URL_RE.lastIndex = 0;
  let cursor = 0;
  let match;
  while ((match = URL_RE.exec(text))) {
    if (match.index > cursor) addTextWithEmojis(parent, text.slice(cursor, match.index));
    const rawUrl = match[0];
    const url = cleanChatUrl(rawUrl);
    const snapshot = snapshotUrl(url);
    if (snapshot) addSnapshot(parent, snapshot);
    else {
      addExternalLink(parent, url);
      const shortSnapshot = tradingViewShortSnapshot(url);
      if (shortSnapshot) addSnapshot(parent, shortSnapshot);
      else if (isTradingViewLink(url)) addTradingViewPreview(parent, url);
    }
    if (url.length < rawUrl.length) addTextWithEmojis(parent, rawUrl.slice(url.length));
    cursor = match.index + rawUrl.length;
  }
  if (cursor < text.length || !text) addTextWithEmojis(parent, text.slice(cursor));
}

function extractLeadingQuote(value) {
  const text = String(value || "");
  const open = text.match(/^\[quote(?:="([^"]*)")?\]/i);
  if (!open) return null;
  const marker = /\[quote(?:=[^\]]*)?\]|\[\/quote\]/gi;
  marker.lastIndex = open[0].length;
  let depth = 1;
  let match;
  while ((match = marker.exec(text))) {
    if (/^\[\/quote/i.test(match[0])) depth -= 1;
    else depth += 1;
    if (depth === 0) {
      return { author: open[1] || "Quoted message", content: text.slice(open[0].length, match.index), reply: text.slice(marker.lastIndex).replace(/^\s+/, "") };
    }
  }
  return null;
}

function addMessageContent(parent, value) {
  const text = String(value || "");
  // A quote is not always the first line: a message may start with a chart URL
  // followed by [quote=...]. Locate the first quote and render preceding text
  // first so raw BBCode is never displayed.
  const quoteAt = /\[quote(?:=(?:"[^"]*"|[^\]]*))?\]/i.exec(text);
  if (!quoteAt) return addRichText(parent, text);
  if (quoteAt.index > 0) addRichText(parent, text.slice(0, quoteAt.index));
  const quote = extractLeadingQuote(text.slice(quoteAt.index));
  // An incomplete quote tag remains plain text so message content is not lost
  // and this function cannot recurse indefinitely.
  if (!quote) return addRichText(parent, text.slice(quoteAt.index));
  const box = document.createElement("div");
  box.className = "quoted-message";
  const author = document.createElement("div");
  author.className = "quote-author";
  author.textContent = `↩ ${quote.author}`;
  box.appendChild(author);
  addMessageContent(box, quote.content);
  parent.appendChild(box);
  if (quote.reply) addMessageContent(parent, quote.reply);
}

function renderMessage(m) {
  const div = document.createElement("div");
  div.className = "msg";
  div.dataset.messageId = m.id || "";

  const avatar = document.createElement("img");
  avatar.className = "avatar";
  avatar.src = m.user_pic || "";
  avatar.onerror = () => { avatar.style.visibility = "hidden"; };
  div.appendChild(avatar);

  const body = document.createElement("div");
  body.className = "body";

  const meta = document.createElement("div");
  meta.className = "meta";
  const username = String(m.username || "Unknown").replace(/^@/, "");
  const usernameEl = document.createElement("span");
  usernameEl.className = "username";
  const profileLink = document.createElement("a");
  profileLink.href = `https://www.tradingview.com/u/${encodeURIComponent(username)}/`;
  profileLink.target = "_blank";
  profileLink.rel = "noopener noreferrer";
  profileLink.textContent = `@${username}`;
  profileLink.title = `Open @${username}'s profile`;
  usernameEl.appendChild(profileLink);
  meta.appendChild(usernameEl);

  if (m.username) {
    const mentionBtn = document.createElement("button");
    mentionBtn.type = "button";
    mentionBtn.className = "mention-user-btn";
    mentionBtn.textContent = "@";
    mentionBtn.title = `Mention @${username}`;
    mentionBtn.setAttribute("aria-label", mentionBtn.title);
    mentionBtn.addEventListener("click", () => mentionUser(username));
    meta.appendChild(mentionBtn);
  }
  if (m.symbol) {
    const symbol = document.createElement("span");
    symbol.className = "symbol";
    symbol.textContent = m.symbol;
    meta.appendChild(symbol);
  }
  const time = document.createElement("span");
  time.className = "time";
  time.textContent = fmtTime(m.time);
  meta.appendChild(time);
  body.appendChild(meta);

  if (m.text) {
    const text = document.createElement("div");
    text.className = "text";
    addMessageContent(text, m.text);
    body.appendChild(text);
  }

  if (m.meta && m.meta.type === "snapshot" && m.meta.url) {
    addSnapshot(body, m.meta.url);
  }

  const actions = document.createElement("div");
  actions.className = "actions";
  const replyBtn = document.createElement("button");
  replyBtn.className = "reply-btn";
  replyBtn.textContent = "↩ Reply";
  replyBtn.addEventListener("click", () => startReply(m));
  actions.appendChild(replyBtn);
  body.appendChild(actions);

  div.appendChild(body);
  return div;
}

// ===== Reply (quote) =====
let activeQuote = null; // { username, text }

const quotePreview = document.getElementById("quote-preview");
const quoteAuthor = document.getElementById("quote-author");
const quoteEditInput = document.getElementById("quote-edit-input");
const quoteClearBtn = document.getElementById("quote-clear");
const composeInput = document.getElementById("compose-input");
const composeResize = document.getElementById("compose-resize");

function installUpwardResize(handle, field, { min, max }) {
  handle.addEventListener("pointerdown", (event) => {
    event.preventDefault();
    const startY = event.clientY;
    const startHeight = field.getBoundingClientRect().height;
    handle.setPointerCapture(event.pointerId);
    const resize = (move) => {
      // Moving upward increases height; moving downward reduces it.
      const next = Math.max(min, Math.min(max, startHeight + startY - move.clientY));
      field.style.height = `${next}px`;
    };
    const finish = () => {
      handle.removeEventListener("pointermove", resize);
      handle.removeEventListener("pointerup", finish);
      handle.removeEventListener("pointercancel", finish);
    };
    handle.addEventListener("pointermove", resize);
    handle.addEventListener("pointerup", finish);
    handle.addEventListener("pointercancel", finish);
  });
}
installUpwardResize(composeResize, composeInput, { min: 30, max: 260 });

function fitQuoteHeight() {
  quoteEditInput.style.height = "auto";
  quoteEditInput.style.height = `${Math.min(quoteEditInput.scrollHeight, 220)}px`;
}

function resetComposerHeights() {
  // Native drag-resize retains textarea height. Reset it after a reply is
  // cancelled or sent so the composer returns to its compact default.
  quoteEditInput.style.height = "";
  composeInput.style.height = "auto";
}

function quoteSourceText(message) {
  const text = String(message?.text || "").trim();
  // Native snapshots store the image in meta.url while text can hold a caption.
  // Include both in a quote to preserve the complete caption and image.
  const mediaUrl = typeof message?.meta?.url === "string" ? message.meta.url.trim() : "";
  if (!mediaUrl || text.includes(mediaUrl) || text.includes(fullSnapshotUrl(mediaUrl))) return text;
  return text ? `${text}\n${mediaUrl}` : mediaUrl;
}

function startReply(m) {
  // A TradingView reply starts with a quote. Remove all balanced leading quotes
  // and retain only the new text authored by this sender.
  const quotedText = replyTextFromMessage(quoteSourceText(m));
  activeQuote = { username: m.username, text: quotedText };
  quoteAuthor.textContent = `Replying to @${m.username}`;
  quoteEditInput.value = quotedText;
  quoteEditInput.placeholder = `Quote @${m.username}`;
  quotePreview.classList.add("active");
  fitQuoteHeight();
  composeInput.focus();
}

function closingQuoteIndex(value, from) {
  const marker = /\[quote(?:=(?:"[^"]*"|[^\]]*))?\]|\[\/quote\]/gi;
  marker.lastIndex = from;
  let depth = 1;
  let match;
  while ((match = marker.exec(value))) {
    if (/^\[\/quote\]/i.test(match[0])) depth -= 1;
    else depth += 1;
    if (depth === 0) return marker.lastIndex;
  }
  return -1;
}

function stripLeadingQuotes(value) {
  let result = String(value || "").trim();
  // Read each block through its matching close. Searching for the first close
  // fails for nested quotes and leaves BBCode that would be resent as a nested
  // quote.
  while (/^\[quote(?:=(?:"[^"]*"|[^\]]*))?\]/i.test(result)) {
    const open = result.match(/^\[quote(?:=(?:"[^"]*"|[^\]]*))?\]/i);
    const end = closingQuoteIndex(result, open[0].length);
    if (end === -1) break;
    result = result.slice(end).replace(/^\s+/, "");
  }
  return result;
}

function replyTextFromMessage(value) {
  const text = String(value || "").trim();
  const ownText = stripLeadingQuotes(text);
  if (ownText) return ownText;
  // When a source message contains only a quote and no new comment, use the
  // innermost content as a fallback without copying quote tags into the reply.
  let quote = extractLeadingQuote(text);
  while (quote) {
    const nested = extractLeadingQuote(quote.content);
    if (!nested) return quote.content.trim();
    quote = nested;
  }
  return "";
}

quoteClearBtn.addEventListener("click", () => {
  activeQuote = null;
  quoteAuthor.textContent = "";
  quoteEditInput.value = "";
  quotePreview.classList.remove("active");
  resetComposerHeights();
});
quoteEditInput.addEventListener("input", fitQuoteHeight);

const emojiPicker = document.getElementById("emoji-picker");
const emojiPickerHead = document.createElement("div");
emojiPickerHead.className = "picker-head";
emojiPickerHead.innerHTML = '<span>Emoji</span><button class="picker-close" type="button" aria-label="Close emoji picker">×</button>';
emojiPickerHead.querySelector("button").addEventListener("click", () => emojiPicker.classList.remove("active"));
emojiPicker.appendChild(emojiPickerHead);
Object.entries(TV_EMOJIS).forEach(([shortcode, visual]) => {
  const button = document.createElement("button");
  button.type = "button";
  button.textContent = visual;
