// Build the outbound string, including a [quote=...] block when a reply is active.
function buildOutgoingText(raw) {
  if (!activeQuote) return raw;
  return `[quote="${activeQuote.username}"]${quoteEditInput.value.trim()}[/quote]\n${raw}`;
}

// ===== @mention autocomplete =====
const mentionDropdown = document.getElementById("mention-dropdown");
let knownUsernames = JSON.parse(localStorage.getItem("tv-chat-known-usernames") || "[]")
  .filter((username) => typeof username === "string" && username.length <= 100); // direktori lintas-room
let mentionHighlightIdx = -1;

function collectUsernames(messages) {
  const set = new Set(knownUsernames);
  messages.forEach((m) => { if (m.username) set.add(m.username); });
  // The bound keeps local storage small while retaining enough entries for
  // global autocomplete across background-monitored rooms.
  knownUsernames = [...set].sort((a, b) => a.localeCompare(b)).slice(-5000);
  localStorage.setItem("tv-chat-known-usernames", JSON.stringify(knownUsernames));
}

function getMentionQuery() {
  const val = composeInput.value;
  const pos = composeInput.selectionStart;
  const uptoCursor = val.slice(0, pos);
  const match = uptoCursor.match(/@([a-zA-Z0-9_]*)$/);
  return match ? match[1] : null;
}

function renderMentionDropdown(query) {
  const matches = knownUsernames
    .filter((u) => u.toLowerCase().startsWith(query.toLowerCase()))
    .slice(0, 8);

  if (matches.length === 0) {
    mentionDropdown.classList.remove("active");
    mentionDropdown.innerHTML = "";
    return;
  }

  mentionHighlightIdx = 0;
  mentionDropdown.innerHTML = matches
    .map((u, i) => `<div class="item${i === 0 ? " highlighted" : ""}" data-username="${escapeHtml(u)}">@${escapeHtml(u)}</div>`)
    .join("");
  mentionDropdown.classList.add("active");

  [...mentionDropdown.children].forEach((el) => {
    el.addEventListener("click", () => applyMention(el.dataset.username));
  });
}

function applyMention(username) {
  const val = composeInput.value;
  const pos = composeInput.selectionStart;
  const uptoCursor = val.slice(0, pos);
  const replaced = uptoCursor.replace(/@([a-zA-Z0-9_]*)$/, `@${username} `);
  composeInput.value = replaced + val.slice(pos);
  mentionDropdown.classList.remove("active");
  composeInput.focus();
}

function mentionUser(username) {
  const cleanUsername = String(username || "").replace(/^@/, "").trim();
  if (!cleanUsername) return;
  const pos = composeInput.selectionStart;
  const before = composeInput.value.slice(0, pos);
  const prefix = before && !/\s$/.test(before) ? " " : "";
  composeInput.setRangeText(`${prefix}@${cleanUsername} `, pos, composeInput.selectionEnd, "end");
  mentionDropdown.classList.remove("active");
  composeInput.style.height = "auto";
  composeInput.style.height = Math.min(composeInput.scrollHeight, 260) + "px";
  composeInput.focus();
}

composeInput.addEventListener("input", () => {
  const q = getMentionQuery();
  if (q !== null) {
    renderMentionDropdown(q);
  } else {
    mentionDropdown.classList.remove("active");
  }
  // auto-grow textarea
  composeInput.style.height = "auto";
  composeInput.style.height = Math.min(composeInput.scrollHeight, 260) + "px";
});

composeInput.addEventListener("keydown", (e) => {
  const items = [...mentionDropdown.children];
  if (mentionDropdown.classList.contains("active") && items.length) {
    if (e.key === "ArrowDown") {
      e.preventDefault();
      mentionHighlightIdx = (mentionHighlightIdx + 1) % items.length;
      items.forEach((it, i) => it.classList.toggle("highlighted", i === mentionHighlightIdx));
      return;
    }
    if (e.key === "ArrowUp") {
      e.preventDefault();
      mentionHighlightIdx = (mentionHighlightIdx - 1 + items.length) % items.length;
      items.forEach((it, i) => it.classList.toggle("highlighted", i === mentionHighlightIdx));
      return;
    }
    if (e.key === "Enter" || e.key === "Tab") {
      e.preventDefault();
      applyMention(items[mentionHighlightIdx].dataset.username);
      return;
    }
    if (e.key === "Escape") {
      mentionDropdown.classList.remove("active");
      return;
    }
  }
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// ===== Send =====
const sendBtn = document.getElementById("send-btn");
const sendNote = document.getElementById("send-note");
const symbolInput = document.getElementById("symbol-input");
const captureState = document.getElementById("capture-state");
const captureReview = document.getElementById("capture-review");
const captureReviewImage = document.getElementById("capture-review-image");
const imageModal = document.getElementById("image-modal");
const imageModalImg = document.getElementById("image-modal-img");
const imageModalClose = document.getElementById("image-modal-close");

function closeImage() {
  imageModal.classList.remove("active");
  imageModalImg.removeAttribute("src");
}
imageModal.addEventListener("click", (event) => { if (event.target === imageModal) closeImage(); });
imageModalClose.addEventListener("click", closeImage);
document.addEventListener("keydown", (event) => {
  if (event.key !== "Escape") return;
  if (captureReview?.classList.contains("active")) clearCapture();
  else closeImage();
});

let pendingCapture = null;
let captureCandidate = null;
function clearCapture() {
  pendingCapture = null;
  captureCandidate = null;
  captureState.textContent = "";
  captureState.classList.remove("active");
  captureReview.classList.remove("active");
  captureReviewImage.removeAttribute("src");
}
function renderCaptureApproval() {
  captureReviewImage.src = captureCandidate;
  captureReview.classList.add("active");
}
document.getElementById("capture-use").addEventListener("click", () => {
  if (!captureCandidate) return;
  pendingCapture = captureCandidate;
  captureCandidate = null;
  captureReview.classList.remove("active");
  captureReviewImage.removeAttribute("src");
  captureState.innerHTML = `<img src="${pendingCapture}" alt="Chart capture attachment" title="Click to preview"><span class="capture-copy">Chart capture attached<br><span class="capture-preview-hint">Click thumbnail to preview</span></span><button type="button" class="capture-remove">Remove</button>`;
  captureState.classList.add("active");
  captureState.querySelector("img").addEventListener("click", () => openImage(pendingCapture));
  captureState.querySelector(".capture-remove").addEventListener("click", clearCapture);
});
document.getElementById("capture-delete").addEventListener("click", clearCapture);
document.getElementById("capture-review-close").addEventListener("click", clearCapture);
captureReview.addEventListener("click", (event) => { if (event.target === captureReview) clearCapture(); });
symbolInput.value = localStorage.getItem("tv-chat-symbol") || "";
symbolInput.addEventListener("change", () => localStorage.setItem("tv-chat-symbol", symbolInput.value.trim()));

// The browser requires the user to select a tab or window; a localhost page
// cannot silently read a TradingView tab. Once selected, the PNG is uploaded
// through the TradingView snapshot endpoint when the user sends it.
document.getElementById("capture-btn").addEventListener("click", async () => {
  if (!navigator.mediaDevices?.getDisplayMedia) {
    sendNote.textContent = "This browser does not support tab capture.";
    sendNote.classList.add("error");
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
    const video = document.createElement("video");
    video.srcObject = stream;
    await video.play();
    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext("2d").drawImage(video, 0, 0);
    stream.getTracks().forEach((track) => track.stop());
    captureCandidate = canvas.toDataURL("image/png");
    pendingCapture = null;
    renderCaptureApproval();
    sendNote.textContent = "";
    sendNote.classList.remove("error");
  } catch (error) {
    if (error.name !== "NotAllowedError") {
      sendNote.textContent = "Could not create the capture.";
      sendNote.classList.add("error");
    }
  }
});

async function sendMessage() {
  const raw = composeInput.value.trim();
  if ((!raw && !pendingCapture) || !currentRoom) return;

  const text = buildOutgoingText(raw);
  const symbol = symbolInput.value.trim();
  sendBtn.disabled = true;
  sendNote.textContent = pendingCapture ? "Uploading snapshot…" : "Sending…";
  sendNote.classList.remove("error");

  try {
    let snapshot = null;
    if (pendingCapture) {
      const snapshotRes = await fetch("/api/snapshot", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ image: pendingCapture, symbol, timezone: Intl.DateTimeFormat().resolvedOptions().timeZone }),
      });
      const snapshotData = await snapshotRes.json();
      if (!snapshotRes.ok) throw new Error(snapshotData.error || "Could not upload the snapshot.");
      snapshot = snapshotData.snapshot;
      sendNote.textContent = "Sending message…";
    }
    const res = await fetch("/api/send", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ room_id: currentRoom, text, symbol, snapshot }),
    });
    const data = await res.json();

    if (!res.ok) {
      sendNote.textContent = data.error || "Could not send the message.";
      sendNote.classList.add("error");
      return;
    }

    composeInput.value = "";
    resetComposerHeights();
    clearCapture();
    activeQuote = null;
    quoteAuthor.textContent = "";
    quoteEditInput.value = "";
    quotePreview.classList.remove("active");
    sendNote.textContent = "";
    fetchMessages();
  } catch (e) {
    sendNote.textContent = "Connection to the backend failed.";
    sendNote.classList.add("error");
  } finally {
    sendBtn.disabled = false;
  }
}

sendBtn.addEventListener("click", sendMessage);

async function loadRooms() {
  const res = await fetch("/api/rooms");
  const payload = await res.json();
  // Older servers return the public array directly; current servers return
  // { public, private }. Accept both so the UI remains available until Node is
  // restarted after an upgrade.
  const groups = Array.isArray(payload) ? { public: payload, private: [] } : payload;
  // Inbox unread counts are a server snapshot. Seed only rooms not yet opened
  // in this browser; thereafter local state is authoritative so badges do not
  // reappear after a room has been read.
  [...(groups.public || []), ...(groups.private || [])].forEach((room) => {
    if (!visitedRoomIds.has(room.room_id) && !unreadByRoom[room.room_id] && Number(room.unread || 0)) {
      unreadByRoom[room.room_id] = Number(room.unread);
    }
  });
  saveUnread();
  const allRooms = [...(groups.public || []), ...(groups.private || [])];
  roomsById = new Map(allRooms.map((room) => [room.room_id, room]));
  roomListEl.innerHTML = "";
  const sortRoomsByActivity = (sourceRooms) => sourceRooms.slice().sort((a, b) => {
      const activityOrder = Number(roomActivity[b.room_id] || 0) - Number(roomActivity[a.room_id] || 0);
      if (activityOrder) return activityOrder;
      return sourceRooms.indexOf(a) - sourceRooms.indexOf(b);
    });
  const renderRoomSection = (key, label, sourceRooms) => {
    const rooms = sortRoomsByActivity(sourceRooms);
    const heading = document.createElement("li");
    heading.className = `room-section-header ${key}-section`;
    const toggle = document.createElement("button");
    toggle.type = "button";
    toggle.className = "room-section-toggle";
    const updateToggle = () => {
      const collapsed = collapsedSections.has(key);
      const sectionUnread = rooms.reduce((total, room) => total + Number(unreadByRoom[room.room_id] || 0), 0);
      toggle.innerHTML = `<span>${escapeHtml(label)}${sectionUnread ? ` <span class="section-badge">${sectionUnread > 99 ? "99+" : sectionUnread}</span>` : ""}</span><span>${collapsed ? "›" : "⌄"}</span>`;
      toggle.setAttribute("aria-expanded", String(!collapsed));
      [...roomListEl.querySelectorAll(`[data-section="${key}"]`)].forEach((entry) => entry.classList.toggle("section-hidden", collapsed));
    };
    toggle.addEventListener("click", () => {
      if (collapsedSections.has(key)) collapsedSections.delete(key); else collapsedSections.add(key);
      localStorage.setItem("tv-chat-collapsed-sections", JSON.stringify([...collapsedSections]));
      updateToggle();
    });
    heading.appendChild(toggle);
    roomListEl.appendChild(heading);
    rooms.forEach((r) => {
    const li = document.createElement("li");
    li.classList.add("room-entry");
    if (r.room_id === currentRoom) li.classList.add("active");
    li.dataset.section = key;
    li.dataset.roomId = r.room_id;
    const unread = Number(unreadByRoom[r.room_id] || 0);
    li.innerHTML = `<button class="room-star${favoriteRoomIds.has(r.room_id) ? " active" : ""}" type="button" aria-label="${favoriteRoomIds.has(r.room_id) ? "Remove from favorites" : "Add to favorites"}" title="Favorite room">★</button><span class="room-title">${escapeHtml(r.title)}</span>${unread ? `<span class="room-badge">${unread > 99 ? "99+" : unread}</span>` : ""}`;
    li.querySelector(".room-star").addEventListener("click", (event) => {
      event.stopPropagation();
      if (favoriteRoomIds.has(r.room_id)) favoriteRoomIds.delete(r.room_id); else favoriteRoomIds.add(r.room_id);
      localStorage.setItem("tv-chat-favorite-rooms", JSON.stringify([...favoriteRoomIds]));
      loadRooms().catch(() => {});
    });
    li.addEventListener("click", () => selectRoom(r));
    roomListEl.appendChild(li);
    });
    updateToggle();
  };
  // Favourites are mirrored: rooms remain rendered in their original category.
  renderRoomSection("favorites", "Favorites", allRooms.filter((room) => favoriteRoomIds.has(room.room_id)));
  renderRoomSection("public", "Public chat", groups.public || []);
  renderRoomSection("private", "Private chat", groups.private || []);
}

function setActiveLi(roomId) {
  [...roomListEl.children].forEach((li) => {
    li.classList.toggle("active", li.dataset.roomId === roomId);
  });
}

function selectRoom(room) {
  roomLoadGeneration += 1;
  loadingOlder = false;
  currentRoom = room.room_id;
  visitedRoomIds.add(room.room_id);
  localStorage.setItem("tv-chat-visited-rooms", JSON.stringify([...visitedRoomIds]));
  renderedIds = new Set();
  currentMessages = loadHistory(room.room_id);
  currentOffset = currentMessages.length;
  hasMoreHistory = true;
  updateJumpLatestButton();
  setActiveLi(room.room_id);
  roomTitleEl.textContent = room.title;
  messagesEl.innerHTML = "";
  statusEl.textContent = "loading…";
  statusEl.classList.remove("error");

  if (pollTimer) clearInterval(pollTimer);
  loadRooms().catch(() => {});
  if (currentMessages.length) {
    renderCurrentMessages({ scrollToLatest: true });
    markCurrentRoomRead();
  }
  fetchMessages({ reset: true });
  pollTimer = setInterval(fetchMessages, POLL_MS);
}

function captureScrollAnchor() {
  const viewportTop = messagesEl.getBoundingClientRect().top;
  const anchor = [...messagesEl.querySelectorAll(".msg")].find((message) => message.getBoundingClientRect().bottom > viewportTop);
  return anchor ? { id: anchor.dataset.messageId, offset: anchor.getBoundingClientRect().top - viewportTop } : null;
}

function restoreScrollAnchor(anchor) {
  if (!anchor?.id) return;
  const target = [...messagesEl.querySelectorAll(".msg")].find((message) => message.dataset.messageId === anchor.id);
  if (!target) return;
  const offset = target.getBoundingClientRect().top - messagesEl.getBoundingClientRect().top;
  messagesEl.scrollTop += offset - anchor.offset;
}

function renderCurrentMessages({ preserveScroll = false, scrollToLatest = true } = {}) {
  ignoreScrollUntil = performance.now() + 120;
  const before = messagesEl.scrollHeight - messagesEl.scrollTop;
  const anchor = preserveScroll ? captureScrollAnchor() : null;
  messagesEl.innerHTML = "";
  const shown = currentMessages.filter(shouldShow);
  if (hasMoreHistory) {
    const older = document.createElement("button");
    older.id = "load-older";
    older.type = "button";
    older.textContent = loadingOlder ? "Loading older messages…" : "Load older messages";
    older.disabled = loadingOlder;
    older.addEventListener("click", loadOlderMessages);
    messagesEl.appendChild(older);
  }
  if (!shown.length) messagesEl.innerHTML += '<div id="empty-state">No messages match this filter.</div>';
  const unreadCount = currentRoom ? Number(unreadByRoom[currentRoom] || 0) : 0;
  // A room without a stored initial ID (for example, unread state from an old
  // session) uses a count-based position as a one-time fallback.
  const fallbackStart = unreadCount ? currentMessages[Math.max(0, currentMessages.length - unreadCount)]?.id : "";
  const unreadStartId = currentRoom ? (unreadStartByRoom[currentRoom] || fallbackStart) : "";
  shown.forEach((message) => {
    if (unreadStartId && String(message.id) === String(unreadStartId)) {
      const divider = document.createElement("div");
      divider.className = "unread-divider";
      divider.textContent = "New messages";
      messagesEl.appendChild(divider);
    }
    renderedIds.add(message.id);
    messagesEl.appendChild(renderMessage(message));
  });
  if (preserveScroll) {
    if (anchor) {
      restoreScrollAnchor(anchor);
      // Image/link previews can settle just after the DOM render. Restore the
      // same message anchor once more so loading older history never jolts the
      // message the user was reading.
      requestAnimationFrame(() => restoreScrollAnchor(anchor));
    } else messagesEl.scrollTop = Math.max(0, messagesEl.scrollHeight - before);
  }
  else messagesEl.scrollTop = scrollToLatest ? messagesEl.scrollHeight : 0;
  updateJumpLatestButton();
}

async function fetchMessages({ reset = false } = {}) {
  if (!currentRoom) return;
  const roomId = currentRoom;
  const generation = roomLoadGeneration;
  try {
    const notificationRoom = roomsById.get(roomId)?.is_notification_room ? "&notification_room=1" : "";
    const res = await fetch(`/api/messages/${encodeURIComponent(roomId)}?offset=0${notificationRoom}`);
    const data = await res.json();

    // Never use a stale room response after the user has switched rooms.
    if (generation !== roomLoadGeneration || roomId !== currentRoom) return;

    if (!res.ok) {
      statusEl.textContent = data.code === "SESSION_EXPIRED"
        ? "session expired — update .env"
        : "failed to load";
      statusEl.classList.add("error");
      return;
    }

    statusEl.classList.remove("error");
    statusEl.textContent = `live · updates every ${POLL_MS / 1000}s · ${data.messages.length}+ messages`;
    collectUsernames(data.messages);
    // The open room is visible to the user. Store its latest marker so background
    // polling does not count older messages as unread after a room switch.
    const latestMessage = data.messages[data.messages.length - 1];
    if (latestMessage?.id) {
      roomLatestIds[roomId] = latestMessage.id;
      localStorage.setItem("tv-chat-room-latest", JSON.stringify(roomLatestIds));
    }
    const atBottom = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 60;
    const oldIds = new Set(currentMessages.map((m) => m.id));
    const additions = reset ? [] : data.messages.filter((m) => !oldIds.has(m.id));
    const room = roomsById.get(roomId);
    additions.forEach((message) => processIncomingMessage(room, message, { countUnread: true }));
    if (additions.length) loadRooms().catch(() => {});
    if (additions.length && !atBottom) {
      if (!unreadStartByRoom[roomId]) unreadStartByRoom[roomId] = additions[0]?.id || "";
      unreadByRoom[roomId] = Number(unreadByRoom[roomId] || 0) + additions.length;
      saveUnread();
    }
    // Retain prior cache entries; offset=0 replaces only the latest page. This
    // prevents pagination from disappearing on each poll.
    const mergedMessages = [...currentMessages.filter((m) => !data.messages.some((latest) => latest.id === m.id)), ...data.messages]
      .sort((a, b) => new Date(a.time) - new Date(b.time));
    const contentChanged = reset || additions.length || mergedMessages.length !== currentMessages.length;
    currentMessages = mergedMessages;
    currentOffset = currentMessages.length;
    saveHistory();
    // A poll with no new messages does not alter the DOM or scroll position,
    // eliminating flicker and subtle jumps on each five-second refresh.
    if (contentChanged) renderCurrentMessages({ preserveScroll: !atBottom && !reset, scrollToLatest: true });
    if (reset) markCurrentRoomRead();
  } catch (e) {
    if (generation !== roomLoadGeneration || roomId !== currentRoom) return;
    statusEl.textContent = "backend connection failed";
    statusEl.classList.add("error");
  }
}

async function loadOlderMessages() {
  if (!currentRoom || loadingOlder || !hasMoreHistory) return;
  const roomId = currentRoom;
  const generation = roomLoadGeneration;
  loadingOlder = true;
  renderCurrentMessages({ preserveScroll: true });
  const nextOffset = currentMessages.length;
  try {
    const notificationRoom = roomsById.get(roomId)?.is_notification_room ? "&notification_room=1" : "";
    const res = await fetch(`/api/messages/${encodeURIComponent(roomId)}?offset=${nextOffset}${notificationRoom}`);
    const data = await res.json();
    if (generation !== roomLoadGeneration || roomId !== currentRoom) return;
    if (!res.ok) return;
    const known = new Set(currentMessages.map((m) => m.id));
    const older = data.messages.filter((m) => !known.has(m.id));
    if (!older.length) { hasMoreHistory = false; statusEl.textContent = "You have reached the oldest available TradingView history."; return; }
    currentMessages = [...older, ...currentMessages].sort((a, b) => new Date(a.time) - new Date(b.time));
    currentOffset = currentMessages.length;
    collectUsernames(currentMessages);
    saveHistory();
  } finally {
    loadingOlder = false;
    if (generation === roomLoadGeneration && roomId === currentRoom) renderCurrentMessages({ preserveScroll: true });
  }
}

messagesEl.addEventListener("scroll", () => {
  const atBottom = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 12;
  if (atBottom) markCurrentRoomRead();
  updateJumpLatestButton();
  if (performance.now() >= ignoreScrollUntil && messagesEl.scrollTop <= 4) loadOlderMessages();
});

async function navigateToNotification(item) {
  if (!item.room_id) return;
  // A notification can originate in a public room not pinned in the sidebar.
  // Create a temporary entry so clicking the notification can still open it.
  let room = roomsById.get(item.room_id);
  if (!room && /^[A-Za-z0-9_-]{1,100}$/.test(item.room_id) && !item.room_id.startsWith("pm_")) {
    room = { room_id: item.room_id, title: item.room_title || `Public chat · ${item.room_id}`, short: item.room_id, is_notification_room: true };
    roomsById.set(room.room_id, room);
  }
  if (!room) return;
  notificationModal.classList.remove("active");
  item.read = true;
  saveNotificationRecords();
  selectRoom(room);
  // Message content is stored in local storage when a notification is detected.
  // There is no need to search or scroll old history; prepare a quote reply.
  startReply({ username: item.username, text: item.reply_text || item.message_text });
}

// Native new-message delivery for unopened rooms uses a public/private WebSocket
// feed. That feed is not a stable HTTP API, so this viewer uses conservative
// 20-second polling to preserve badges without requiring users to open each room.
async function refreshUnreadRooms() {
  const roomIds = [...roomsById.keys()].filter((id) => id !== currentRoom);
  for (let i = 0; i < roomIds.length; i += 4) {
    const batch = roomIds.slice(i, i + 4);
    await Promise.all(batch.map(async (roomId) => {
      try {
        const res = await fetch(`/api/messages/${encodeURIComponent(roomId)}?offset=0`);
        const data = await res.json();
        if (!res.ok || !data.messages?.length) return;
        // This background feed covers every room, so use it as the global
        // mention directory rather than only the currently open room.
        collectUsernames(data.messages);
        const latest = data.messages[data.messages.length - 1];
        const previous = roomLatestIds[roomId];
        let additions = [];
        if (roomWatchPrimed && previous && previous !== latest.id) {
          const position = data.messages.findIndex((message) => message.id === previous);
          additions = position >= 0 ? data.messages.slice(position + 1) : [latest];
          if (!unreadStartByRoom[roomId]) unreadStartByRoom[roomId] = additions[0]?.id || "";
          unreadByRoom[roomId] = Number(unreadByRoom[roomId] || 0) + additions.length;
        }
        // Bootstrap inspects the latest page once, then only new messages. This
        // ensures local notifications retain both room and message content.
        const messagesToInspect = roomWatchPrimed ? additions : data.messages;
        const room = roomsById.get(roomId);
        messagesToInspect.forEach((message) => processIncomingMessage(room, message, { countUnread: roomWatchPrimed }));
        roomLatestIds[roomId] = latest.id;
      } catch (_) { }
    }));
  }
  roomWatchPrimed = true;
  localStorage.setItem("tv-chat-room-latest", JSON.stringify(roomLatestIds));
  localStorage.setItem("tv-chat-room-watch-primed", "1");
  saveUnread();
  loadRooms().catch(() => {});
}

function extractNotifications(value, output = [], inheritedId = null) {
  if (Array.isArray(value)) value.forEach((item) => extractNotifications(item, output, inheritedId));
  else if (value && typeof value === "object") {
    const data = notificationData(value);
    const id = value.id ?? inheritedId;
    const type = String(value.type || data.type || "").toLowerCase();
    // Some responses place the ID on a wrapper and `type` deep in data; retain
    // the wrapper ID while traversing nested objects.
    if (id != null && (type.includes("mention") || type.includes("reply"))) {
      output.push({ ...notificationData(value), id: String(id), type, raw: value });
    }
    Object.values(value).forEach((item) => extractNotifications(item, output, id));
  }
  return output;
}
async function pollNotifications() {
  try {
    const res = await fetch("/api/notifications");
    const data = await res.json();
    const itemsById = new Map();
    extractNotifications(data).forEach((item) => {
      const previous = itemsById.get(String(item.id));
      const score = Number(Boolean(item.room_id)) + Number(Boolean(item.username)) + Number(Boolean(item.text));
      const previousScore = previous ? Number(Boolean(previous.room_id)) + Number(Boolean(previous.username)) + Number(Boolean(previous.text)) : -1;
      if (!previous || score > previousScore) itemsById.set(String(item.id), item);
    });
    // For some accounts, the native endpoint contains only sender and time. Do
    // not store it as a reply notification when room or text is incomplete;
    // recordChatNotification() above retains the complete feed version.
    const items = [...itemsById.values()].filter((item) => item.room_id && item.username && item.text);
    const fresh = items.filter((item) => !notificationIds.has(String(item.id)));
    if (fresh.length) {
      notificationUnread += fresh.length;
      localStorage.setItem("tv-chat-notification-unread", String(notificationUnread));
      renderNotificationBadge();
      if (notificationIds.size) {
        const audio = new Audio("/sounds/mention.mp3");
        audio.play().catch(() => {});
      }
    }
    // Replace older records with the latest payload. This corrects notifications
    // previously stored without room_id because of API structure variation.
    const recordsById = new Map(notificationRecords.map((item) => [String(item.id), item]));
    items.forEach((item) => recordsById.set(String(item.id), item));
    notificationRecords = [...recordsById.values()].slice(-300);
    items.forEach((item) => notificationIds.add(String(item.id)));
    localStorage.setItem("tv-chat-notification-ids", JSON.stringify([...notificationIds].slice(-500)));
    localStorage.setItem("tv-chat-notification-records", JSON.stringify(notificationRecords));
    const unseen = fresh.length;
    const title = unseen ? `(${unseen}) Public Chat Viewer` : "Public Chat Viewer";
    document.title = title;
  } catch (_) { /* Local badges continue functioning when the notification endpoint fails. */ }
}

Promise.all([fetch("/api/config").then((r) => r.json()), loadRooms()]).then(([config]) => {
  selfUsername = config.username || "";
  // TradingView onsite notifications do not consistently provide chat content
  // or room information. The local chat feed retained through refreshUnreadRooms()
  // is the single source for replyable notification records.
  refreshUnreadRooms();
  setInterval(refreshUnreadRooms, 20_000);
});
</script>
